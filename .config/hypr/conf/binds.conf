####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$terminal = alacritty
$fileManager = thunar
$calculator = GTK_THEME=Adwaita-dark gnome-calculator
$menu = rofi -show drun -theme ~/.config/rofi/dynamic-island.rasi
$mainMenu = ~/.config/rofi/scripts/main-menu.sh
$powerMenu = ~/.config/rofi/scripts/powermenu.sh
$webSearch = ~/.config/rofi/scripts/web-search.sh

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, M, exit,   # exit hyprland
bind = $mainMod, B, killactive,
bind = $mainMod, E, exec, $fileManager -w
bind = , F12, exec, $calculator
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, pkill rofi || $menu
bind = $mainMod, SPACE, exec, pkill rofi || $mainMenu  # Main menu with sub-menus
bind = $mainMod SHIFT, P, exec, pkill rofi || $powerMenu  # Power menu
bind = $mainMod SHIFT, W, exec, pkill rofi || $webSearch  # Web search
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, #
bind = $mainMod, F, fullscreen
# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = ALT, left, movewindow, l
bind = ALT, right, movewindow, r
bind = ALT, up, movewindow, u
bind = ALT, down, movewindow, d
bind = ALT, TAB, cyclenext

# Screenshot
bind = CTRL, Print, exec, hyprshot -m window --clipboard-only
bind =, Print, exec, hyprshot -m region --clipboard-only
bind = ALT, Print, exec, hyprshot -m active -m output --clipboard-only

# Lock screen
bind = $mainMod, l, exec, hyprlock

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Sound config
bind = ALT ,F1, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ALT, F2, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ALT, F3, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ALT, F4, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness
bind = ALT, F5, exec, brightnessctl set 5%-
bind = ALT, F6, exec, brightnessctl set 5%+

# bind = ALT, TAB, exec, wlogout
#bind = CTRL, ESCAPE, exec, gksu
bind = ALT, w, exec, ~/.config/hypr/wallpaper.sh
bind = ALT, a, exec, ~/.config/waybar/refresh.sh 
bind = ALT, r, exec, ~/.config/swaync/refresh.sh

bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
