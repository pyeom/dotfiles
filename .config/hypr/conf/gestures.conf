# See https://wiki.hyprland.org/Configuring/Gestures/ for more

gestures {
    # 3-finger left/right: navigate workspaces (left = previous, right = next)
    gesture = 3, horizontal, workspace

    # 3-finger up: toggle special workspace
    gesture = 3, up, dispatcher, togglespecialworkspace

    # 4-finger up: toggle wvkbd on-screen keyboard
    gesture = 4, up, exec, ~/.config/wvkbd/toggle.sh

    workspace_swipe_create_new = false
    workspace_swipe_invert = true
}