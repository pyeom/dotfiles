# Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 1, 0.5, 0.16, 1.3
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 15, default, popin 80%
    animation = border, 1, 10, default
    bezier = linear, 0,0,1,1
    animation = borderangle, 1, 60, linear, loop
    animation = fade, 1, 2, default
    animation = workspaces, 1, 5, default
    animation = specialWorkspace, 1, 6, default, slidefadevert +50%

    # Dynamic Island style animations for layers (rofi, waybar, etc)
    animation = layers, 1, 4, overshot, slide
    animation = layersIn, 1, 4, smoothIn, slide
    animation = layersOut, 1, 4, smoothOut, slide
}